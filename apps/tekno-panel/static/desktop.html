<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEKNO CONTROL · Desk</title>
  <meta name="description" content="Desktop control room for the 24/7 tekno production machine">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/desktop.css">
</head>
<body class="desk">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- login -->
  <section id="dk-login" class="dk-login hidden" aria-label="Login">
    <form class="glass dk-login-box" id="dk-login-form">
      <div class="logo big"><span class="logo-a">TEKNO</span><span class="logo-b">CONTROL</span></div>
      <p class="muted">Passcode</p>
      <input id="dk-pass" type="password" inputmode="numeric" autocomplete="current-password" autofocus aria-label="Passcode">
      <button class="btn approve" type="submit">Enter</button>
      <p class="err" id="dk-login-err" role="alert"></p>
    </form>
  </section>

  <div id="dk-app" class="hidden">
    <header class="dk-top">
      <div class="logo"><span class="logo-a">TEKNO</span><span class="logo-b">CONTROL</span></div>
      <div class="kpis" id="kpis"></div>
      <div class="dk-top-right">
        <span class="upd mono" id="upd" title="Last update from the machine"></span>
        <button class="chip mode-chip" id="mode-chip" title="Switch live / demo (D)">LIVE</button>
        <span class="live-dot" id="live-dot" title="connection"></span>
        <button class="icon-btn" id="fs-btn" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
        <button class="icon-btn" id="help-btn" title="Keyboard shortcuts (?)" aria-label="Shortcuts">?</button>
        <a class="icon-btn" href="/?view=phone" id="phone-link" title="Phone view" aria-label="Phone view">▯</a>
        <button class="icon-btn" id="logout-btn" title="Log out" aria-label="Log out">⏻</button>
      </div>
    </header>
    <div class="banner hidden" id="banner"></div>

    <main class="dk-grid">
      <section class="panel p-pipe">
        <div class="panel-head">
          <h3>Pipeline <small id="pipe-sum"></small></h3>
          <div class="seg" id="state-filter">
            <button data-f="" aria-pressed="true">All</button>
            <button data-f="working" aria-pressed="false">Working</button>
            <button data-f="failed" aria-pressed="false">Failed</button>
            <button data-f="review" aria-pressed="false">Review</button>
          </div>
          <input class="search" id="search" type="search" placeholder="Find track  /" aria-label="Find track">
        </div>
        <div class="board" id="board"></div>
      </section>

      <section class="panel p-bots">
        <div class="panel-head"><h3>Live bots <small>click a creature</small></h3><div class="legend">
          <span><i class="lg working"></i>working</span><span><i class="lg idle"></i>sleeping</span>
          <span><i class="lg failed"></i>failed</span><span><i class="lg waiting"></i>waiting</span></div></div>
        <canvas id="dk-bots"></canvas>
      </section>

      <section class="panel p-listen">
        <div class="panel-head"><h3>Listen</h3><button class="toggle" id="follow-btn" aria-pressed="true" title="Load new takes as they land">Follow newest</button></div>
        <div class="now"><div><div class="now-title" id="now-title">Nothing loaded</div><div class="now-sub muted" id="now-sub">Pick a take</div></div></div>
        <canvas id="spectrum" class="viz" height="150"></canvas>
        <canvas id="scope" class="viz" height="64"></canvas>
        <div class="meters"><div class="meter"><i id="meter-l"></i></div><div class="meter"><i id="meter-r"></i></div><span id="meter-db" class="mono">-∞ dB</span></div>
        <div class="seekrow"><span id="t-cur" class="mono">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="t-dur" class="mono">0:00</span></div>
        <div class="transport dk-transport">
          <button class="ab" id="ab-a" aria-pressed="true" title="A">A · take</button>
          <button class="play" id="play-btn" aria-label="Play (space)">▶</button>
          <button class="ab" id="ab-b" aria-pressed="false" title="B">B · SIFRES</button>
        </div>
        <div class="filter-row" id="listen-cards"></div>
        <div class="list dk-list" id="audio-list"></div>
      </section>

      <section class="panel p-scores">
        <div class="panel-head"><h3>Scores</h3><div class="filter-row" id="score-cards"></div></div>
        <div class="scores-body">
          <div class="verdict-box dk-verdict" id="verdict-box"></div>
          <div class="badges dk-badges" id="badges"></div>
          <div class="chart-tabs">
            <div class="seg" id="chart-tabs">
              <button data-c="lufs" aria-pressed="true">LUFS-I</button>
              <button data-c="tp" aria-pressed="false">True peak</button>
              <button data-c="judge" aria-pressed="false">Judge · EarLoop</button>
            </div>
            <canvas id="score-chart" height="150"></canvas>
          </div>
        </div>
      </section>

      <section class="panel p-health">
        <div class="panel-head"><h3>Machine <small id="gpu-name"></small></h3></div>
        <div class="health-top">
          <div class="gauge-box"><canvas id="g-util" width="110" height="110"></canvas><span>GPU</span></div>
          <div class="gauge-box"><canvas id="g-vram" width="110" height="110"></canvas><span>VRAM</span></div>
        </div>
        <div class="kv dk-kv" id="gpu-kv"></div>
        <canvas id="ch-gpu" height="56"></canvas>
        <div id="ace-box"></div>
        <div id="disk-box"></div>
        <div class="svc" id="svc-box"></div>
      </section>

      <section class="panel p-chat">
        <div class="panel-head"><h3>Agent chat</h3><div class="filter-row" id="thread-row"></div></div>
        <div class="chat dk-chat" id="chat"></div>
      </section>
    </main>
  </div>

  <aside class="drawer glass" id="drawer" aria-hidden="true">
    <button class="icon-btn drawer-x" id="drawer-x" aria-label="Close (Esc)">✕</button>
    <div id="drawer-body"></div>
  </aside>
  <div class="dk-modal hidden" id="modal"><div class="glass dk-modal-box" id="modal-box"></div></div>
  <div class="toast hidden" id="toast" role="status"></div>

  <audio id="audio-a" preload="metadata" crossorigin="anonymous"></audio>
  <audio id="audio-b" preload="metadata" crossorigin="anonymous"></audio>
  <script src="/static/js/charts.js"></script>
  <script src="/static/js/bots.js"></script>
  <script src="/static/js/player.js"></script>
  <script src="/static/js/desktop.js"></script>
</body>
</html>
